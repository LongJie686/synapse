[project]
name = "synapse-server"
version = "0.1.0"
description = "Synapse API server"
requires-python = ">=3.11"

dependencies = [
    "synapse-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "openai>=1.60",
    "anthropic>=0.42",
    "pydantic-settings>=2.7",
    "tiktoken>=0.9.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synapse_server"]

[project]
name = "synapse-core"
version = "0.1.0"
description = "Synapse multi-agent orchestration engine"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "tiktoken>=0.9.0",
    "openai>=1.60",
    "anthropic>=0.42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synapse_core"]
